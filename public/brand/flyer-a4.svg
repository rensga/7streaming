<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" role="img" aria-labelledby="title description">
  <title id="title">Flyer de 7streaming</title>
  <desc id="description">Flyer vertical de una tienda independiente de streaming y herramientas creativas, sin afiliación con las marcas listadas.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#181B1E"/><stop offset="1" stop-color="#101114"/></linearGradient>
    <linearGradient id="scene" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#30464B"/><stop offset=".58" stop-color="#82916B"/><stop offset="1" stop-color="#D0916B"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#B9F36B" stop-opacity=".2"/><stop offset="1" stop-color="#B9F36B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1240" height="1754" fill="url(#background)"/>
  <circle cx="905" cy="810" r="500" fill="url(#glow)"/>
  <g transform="translate(92 88)">
    <rect width="68" height="68" rx="20" fill="#B9F36B"/>
    <path d="M13 18h42v9H39L27 57h-10l12-30H13z" fill="#15171A"/>
    <path d="m48 48 10 6-10 6z" fill="#FF916B"/>
    <text x="84" y="49" fill="#F3F1EC" font-family="Manrope, 'Segoe UI', sans-serif" font-size="43" font-weight="800" letter-spacing="-2">streaming<tspan fill="#B9F36B">.</tspan></text>
  </g>
  <g transform="translate(95 245)">
    <rect width="374" height="48" rx="24" fill="#22262A" stroke="#3C4241"/>
    <circle cx="24" cy="24" r="6" fill="#B9F36B"/>
    <text x="45" y="30" fill="#C2C5BD" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="16" font-weight="700" letter-spacing="1.8">DESCUBRE · COMPARA · DECIDE</text>
  </g>
  <text x="91" y="452" fill="#F3F1EC" font-family="Manrope, 'Segoe UI', sans-serif" font-size="103" font-weight="700" letter-spacing="-5">Menos ruido.</text>
  <text x="91" y="562" fill="#F3F1EC" font-family="Manrope, 'Segoe UI', sans-serif" font-size="103" font-weight="700" letter-spacing="-5">Más buenas</text>
  <text x="91" y="672" fill="#B9F36B" font-family="Manrope, 'Segoe UI', sans-serif" font-size="103" font-weight="700" letter-spacing="-5">elecciones.</text>
  <text x="98" y="759" fill="#B8BAB5" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="29">Explora plataformas de entretenimiento y herramientas creativas.</text>
  <g transform="rotate(4 851 1015)">
    <rect x="650" y="821" width="402" height="467" rx="25" fill="#202428" stroke="#555E57" stroke-width="2"/>
    <rect x="668" y="839" width="366" height="431" rx="15" fill="url(#scene)"/>
    <circle cx="934" cy="921" r="44" fill="#F1D493"/>
    <path d="m668 1111 128-148 87 100 59-66 92 116v157H668z" fill="#475D54"/>
    <path d="m668 1159 137-83 79 70 72-44 78 71v97H668z" fill="#1C3232"/>
    <circle cx="850" cy="1086" r="41" fill="#F3F1EC" fill-opacity=".94"/>
    <path d="m840 1065 28 21-28 21z" fill="#15171A"/>
  </g>
  <g transform="translate(96 906)">
    <text x="0" y="0" fill="#B9F36B" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="17" font-weight="800" letter-spacing="2">TIENDA INDEPENDIENTE</text>
    <text x="0" y="67" fill="#F3F1EC" font-family="Manrope, 'Segoe UI', sans-serif" font-size="31" font-weight="700">Encuentra opciones.</text>
    <text x="0" y="110" fill="#F3F1EC" font-family="Manrope, 'Segoe UI', sans-serif" font-size="31" font-weight="700">Elige con información clara.</text>
    <text x="0" y="170" fill="#B8BAB5" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="21">Explora ofertas y revisa precios y condiciones</text>
    <text x="0" y="205" fill="#B8BAB5" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="21">en cada ficha de 7streaming.</text>
    <text x="0" y="267" fill="#B8BAB5" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="21">Checkout en preparación. Sin contraseñas</text>
    <text x="0" y="302" fill="#B8BAB5" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="21">ni cuentas compartidas.</text>
  </g>
  <g transform="translate(96 1370)">
    <rect width="410" height="82" rx="14" fill="#B9F36B"/>
    <text x="28" y="52" fill="#15171A" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="800" letter-spacing=".7">EXPLORA EL CATÁLOGO</text>
    <path d="M370 29v23m-10-11h20" stroke="#15171A" stroke-width="2.5"/>
  </g>
  <g transform="translate(96 1583)">
    <path d="M0 0h1048" stroke="#464A47" stroke-width="2"/>
    <text x="0" y="44" fill="#DBDDD6" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="17" font-weight="700">Tienda independiente. No afiliada a las plataformas mencionadas.</text>
    <text x="0" y="78" fill="#92958F" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="15">Checkout en preparación. Las marcas pertenecen a sus titulares.</text>
  </g>
</svg>