  <text x="75" y="632" fill="#B8BAB5" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="23">Servicios de entretenimiento y creatividad,</text>
  <text x="75" y="668" fill="#B8BAB5" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="23">en un catálogo independiente.</text>
