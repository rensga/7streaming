  </g>
  <text x="72" y="382" fill="#F3F1EC" font-family="Manrope, 'Segoe UI', sans-serif" font-size="80" font-weight="700" letter-spacing="-4">Menos ruido.</text>
  <text x="72" y="472" fill="#F3F1EC" font-family="Manrope, 'Segoe UI', sans-serif" font-size="80" font-weight="700" letter-spacing="-4">Más buenas</text>
