    <radialGradient id="glow"><stop stop-color="#B9F36B" stop-opacity=".19"/><stop offset="1" stop-color="#B9F36B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#background)"/>
