<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">Pieza para redes de Eligeva</title>
  <desc id="description">Gráfico editorial de una tienda independiente de entretenimiento y creatividad, sin afiliación con las marcas.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171A1D"/><stop offset="1" stop-color="#101114"/></linearGradient>
